<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartographia: The Alchemist's Atlas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="event-message" class="event-message"></div> <!-- New event message display -->
    <h1>Cartographia: The Alchemist's Atlas</h1>

    <div id="controls-container">
        <div id="element-selection">
            <h2>Elements</h2>
            <div id="element-buttons">
                <!-- Buttons for elements will be populated here by JS -->
            </div>
            <p>Selected: <span id="selected-element-display">None</span></p>
        </div>

        <div id="alchemy-table-container">
            <h2>Alchemy Table</h2>
            <div>
                Slot 1: <span id="fusion-slot-1" class="fusion-slot">Empty</span>
            </div>
            <div>
                Slot 2: <span id="fusion-slot-2" class="fusion-slot">Empty</span>
            </div>
            <button id="fuse-button">Fuse</button>
            <button id="clear-fusion-slots-button">Clear Slots</button>
            <p id="fusion-result-message"></p>
            <h3>Discovered Fusions:</h3>
            <ul id="discovered-fusions-display">
                <!-- Discovered fusions will be listed here -->
            </ul>
        </div>

        <div id="player-hand-container">
            <h2>Player Hand</h2>
            <div id="player-hand-contents">
                <!-- Player hand contents (seed names and counts) -->
            </div>
        </div>

        <div id="objective-container">
            <h2>Current Objective</h2>
            <p id="objective-status-message" class="objective-message"></p>
            <p id="objective-description">Loading objective...</p>
            <ul id="objective-requirements-list">
                <!-- Individual requirements will be listed here -->
            </ul>
        </div>

        <div id="actions-container">
            <h2>Actions</h2>
            <button id="undo-button">Undo</button>
            <button id="redo-button">Redo</button>
            <button id="save-button">Save Game</button>
            <button id="load-button">Load Game</button>
            <button id="reset-button">Reset Game</button>
        </div>
    </div>

    <div id="map-container">
        <!-- Game map will be rendered here by JS -->
    </div>

    <div id="tile-info-panel">
        <h3>Tile Info</h3>
        <p><strong>Terrain:</strong> <span id="info-terrain">N/A</span></p>
        <p><strong>Elevation:</strong> <span id="info-elevation">N/A</span></p>
        <p><strong>Feature:</strong> <span id="info-feature">N/A</span></p>
        <div id="info-saturation">
            <!-- Elemental saturation details here -->
        </div>
    </div>

    <div id="lore-compendium-container">
        <h2>Lore Compendium</h2>
        <ul id="lore-entries-list">
            <!-- Lore entries will be populated here -->
        </ul>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
