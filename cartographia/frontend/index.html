<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartographia: The Alchemist's Atlas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cartographia: The Alchemist's Atlas</h1>

    <div id="controls-container">
        <h2>Controls</h2>
        <p>Selected Element: <span id="selected-element-display">None</span></p>
        <div id="element-buttons">
            <button class="element-button" data-element="Earth">Earth</button>
            <button class="element-button" data-element="Water">Water</button>
            <button class="element-button" data-element="Fire">Fire</button>
            <button class="element-button" data-element="Life">Life</button>
            <button class="element-button" data-element="Decay">Decay</button>
            <!-- Add more buttons as needed -->
        </div>
        <div>
            <button id="undo-button">Undo</button>
            <button id="redo-button">Redo</button>
        </div>
        <div>
            <button id="save-button">Save Game</button>
            <button id="load-button">Load Game</button>
        </div>

        <div id="alchemy-table-container">
            <h2>Alchemy Table</h2>
            <div id="fusion-slots">
                <span id="fusion-slot-1" class="fusion-slot" data-slot="1">Slot 1</span>
                <span>+</span>
                <span id="fusion-slot-2" class="fusion-slot" data-slot="2">Slot 2</span>
            </div>
            <button id="fuse-button">Fuse</button>
            <button id="clear-fusion-slots-button">Clear Slots</button>
            <p id="fusion-result-message" class="status-message"></p>
            <div id="discovered-fusions-container">
                <h4>Discovered Concepts:</h4>
                <div id="discovered-fusions-display">None yet.</div>
            </div>
        </div>

        <div id="player-hand-container">
            <h3>Your Seeds:</h3>
            <div id="player-hand-contents">
                <!-- Hand contents will be rendered here -->
                Loading hand...
            </div>
        </div>
        <div id="objective-container">
            <h3>Current Objective:</h3>
            <div id="objective-status-message" class="status-message"></div>
            <p id="objective-description">Loading objective...</p>
            <!-- Optional: <p id="objective-requirements"></p> -->
        </div>
    </div>

    <hr>

    <div id="map-container">
        <!-- Map will be rendered here by JavaScript -->
    </div>

    <script src="js/script.js"></script>
</body>
</html>
