<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartographia: The Alchemist's Atlas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cartographia: The Alchemist's Atlas</h1>

    <div id="controls-container">
        <h2>Controls</h2>
        <p>Selected Element: <span id="selected-element-display">None</span></p>
        <button class="element-button" data-element="Earth">Earth</button>
        <button class="element-button" data-element="Water">Water</button>
        <button class="element-button" data-element="Fire">Fire</button>
        <button class="element-button" data-element="Life">Life</button>
        <button class="element-button" data-element="Decay">Decay</button>
        <!-- Add more buttons as needed -->
    </div>

    <hr>

    <div id="map-container">
        <!-- Map will be rendered here by JavaScript -->
    </div>

    <script src="js/script.js"></script>
</body>
</html>
